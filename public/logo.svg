<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DataNest Logo: base de datos estilizada con nido (nest) -->
  <rect width="48" height="48" rx="12" fill="#6366f1"/>
  <!-- Elipse superior (tapa de la BD) -->
  <ellipse cx="24" cy="16" rx="12" ry="4.5" fill="white" fill-opacity="0.95"/>
  <!-- Cuerpo de la base de datos -->
  <path d="M12 16 C12 16 12 28 12 30 C12 33.314 17.373 36 24 36 C30.627 36 36 33.314 36 30 V16" fill="white" fill-opacity="0.15"/>
  <!-- Línea intermedia (estante) -->
  <path d="M12 22 C12 25.314 17.373 28 24 28 C30.627 28 36 25.314 36 22" stroke="white" stroke-opacity="0.6" stroke-width="1.5" fill="none"/>
  <!-- Línea inferior -->
  <path d="M12 28 C12 31.314 17.373 34 24 34 C30.627 34 36 31.314 36 28" stroke="white" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
  <!-- Contorno del cuerpo -->
  <path d="M12 16 V30 C12 33.314 17.373 36 24 36 C30.627 36 36 33.314 36 30 V16" stroke="white" stroke-opacity="0.8" stroke-width="1.5" fill="none"/>
  <!-- Punto de conexión: destello de datos activos -->
  <circle cx="24" cy="16" r="2.5" fill="#10b981"/>
</svg>
